<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ec">
<title>Kuytu</title>
<meta name="description" content="Aynı sayfalarda farklı hayatlar.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuytu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400..700&family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>
// Görünüm: açık, koyu ya da cihaza göre. Sayfa çizilmeden uygulanır ki gece açınca beyaz parlamasın
(function () { var t = 'acik'; try { t = localStorage.getItem('kuytu-tema') || 'acik'; } catch (e) {} if (t === 'koyu' || (t === 'sistem' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-dark', ''); })();
</script>
</head>
<body>
<main id="view"><div class="loading" role="status"><span class="kt light">Kuytu</span><span class="ld" aria-hidden="true"><i></i><i></i><i></i></span><span class="sr-only">Kitap açılıyor</span></div></main>
<div id="card" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="src/app.js"></script>
<script>
// Yeni sürüm yayınlanınca sayfa bir kez kendiliğinden yenilenir (ilk kurulumda değil)
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
</html>
